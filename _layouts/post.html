---
layout: default
highlight: true
---
<article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="page-header">
    <h1 class="page-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%B %-d, %Y" }}</time>
      &nbsp;&middot;&nbsp; {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read
    </p>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  {% include navlinks.html %}
</article>
