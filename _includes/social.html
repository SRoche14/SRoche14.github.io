<div class="social">
  {% if site.email %}<a href="mailto:{{ site.email }}" title="Email"><i class="fa-solid fa-envelope"></i></a>{% endif %}
  {% if site.scholar_userid %}<a href="https://scholar.google.com/citations?user={{ site.scholar_userid }}" title="Google Scholar"><i class="fa-brands fa-google-scholar"></i></a>{% endif %}
  {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}" title="GitHub"><i class="fa-brands fa-github"></i></a>{% endif %}
  {% if site.linkedin_username %}<a href="https://www.linkedin.com/in/{{ site.linkedin_username }}" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>{% endif %}
  <a href="{{ '/feed.xml' | relative_url }}" title="RSS feed"><i class="fa-solid fa-square-rss"></i></a>
</div>
